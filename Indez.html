<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result summary Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="Parent_container">
<div class="purple_container">
    <div class="your_result">
        <p>Your Result</p>
    </div>
  <div class="Round_object">
        <span class="number">76</span>
        <p>of 100</p>
    </div>
<div class="Great">
    <h2>Great</h2>
    <p>
        You scored higher than 65% of <br>
        the people who have taken <br>
        these tests.
    </p>
</div>
</div>

<div class="Second_container">
<h2 class="Second_h2">Summary</h2>
<div class="button_divs">
<button class="button1">
  <span>
    <span>  <img src="icon-reaction.svg" alt="Reation"></span>
  <span style="color: hsl(0, 100%, 67%);"> Reation</span>
  </span>
  <span>80/100</span>
    <!-- <p style="color: hsl(0, 100%, 67%);"> Reation</p> -->
</button>
<button class="button2">
    <span>
<span><img src="icon-memory.svg" alt="memory"></span>
<span style="color:hsl(39, 100%, 56%) ;">Memory</span>
</span>
<span>92/100</span>
<!-- <p style="color:hsl(39, 100%, 56%) ;">Memory</p> -->
</button>
<button class="button3">
    <span>
   <span> <img src="icon-verbal.svg" alt="verbal"></span>
  <span style="color:hsl(166, 100%, 37%) ;">Verbal</span>
    </span>
  <span>61/100</span>
    <!-- <p style="color:hsl(166, 100%, 37%) ;">Verbal</p> -->
</button>
<button class="button4">
    <span>
  <span> <img src="icon-visual.svg" alt="Visual"></span>
  <span style="color:hsl(234, 85%, 45%) ;">Visual</span>
    </span>
   <span>73/100</span>
    <!-- <p style="color:hsl(234, 85%, 45%) ;">Visual</p> -->
</button>
 <button class="continue">
    continue
 </button>

</div>



</div>


</div>    
</body>
</html>
